<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eutide · 情绪水晶球</title>
<style>
  :root{
    --bg-page:#F3F1EA; --bg-card:#FBFAF6; --bg-card-alt:#EDEAE0;
    --border-soft:#E0DCD0; --text-primary:#3D3A32; --text-muted:#7A756A;
    --text-faint:#ABA599; --accent:#7A9B6E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-page);color:var(--text-primary);
    font-family:-apple-system,"PingFang SC","Quicksand",sans-serif;
    padding:28px 18px 70px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:22px;font-weight:600;margin-bottom:4px}
  .sub{color:var(--text-muted);font-size:13px;margin-bottom:24px}
  .stage{display:grid;grid-template-columns:320px 1fr;gap:30px;align-items:start}
  @media(max-width:620px){.stage{grid-template-columns:1fr}}

  .ballWrap{position:relative;width:300px;height:300px;margin:0 auto}
  .backdrop{position:absolute;inset:-26px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%,#DDE7D2,transparent 55%),
               radial-gradient(circle at 70% 70%,#E7D9C8,transparent 55%);filter:blur(5px)}
  .ball{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    box-shadow:0 16px 38px rgba(120,100,70,.24),
               inset 0 2px 8px rgba(255,255,255,.6),
               inset 0 -16px 30px rgba(90,70,50,.1);
    background:rgba(255,255,255,.05)}

  .chamber{position:absolute;width:50%;height:50%;overflow:hidden}
  .tl{left:0;top:0} .tr{right:0;top:0} .bl{left:0;bottom:0} .br{right:0;bottom:0}
  .liquid{position:absolute;left:-6%;right:-6%;bottom:0;transition:height .55s cubic-bezier(.4,1.1,.5,1)}
  .wave{position:absolute;left:0;top:-14px;width:200%;height:20px}
  .wave svg{width:50%;height:100%;display:block;float:left}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .divH{position:absolute;left:4%;right:4%;top:50%;height:1.5px;transform:translateY(-50%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);z-index:5}
  .divV{position:absolute;top:4%;bottom:4%;left:50%;width:1.5px;transform:translateX(-50%);
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.5),transparent);z-index:5}
  .specular{position:absolute;width:100px;height:66px;left:40px;top:34px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,255,255,.75),transparent);filter:blur(4px);
    transform:rotate(-18deg);z-index:6;pointer-events:none}
  .rim{position:absolute;inset:0;border-radius:50%;z-index:6;pointer-events:none;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4),inset 0 -8px 22px rgba(255,255,255,.12)}

  .qlabel{position:absolute;font-size:11px;font-weight:600;color:rgba(61,58,50,.55);z-index:7;pointer-events:none}
  .lbTL{left:16px;top:14px} .lbTR{right:16px;top:14px}
  .lbBL{left:16px;bottom:14px} .lbBR{right:16px;bottom:14px}

  .insight{text-align:center;font-size:13px;color:var(--text-muted);margin-top:16px}
  .insight b{color:var(--text-primary);font-weight:600}

  .panel .block{background:var(--bg-card);border-radius:14px;padding:13px 15px;margin-bottom:11px;
    box-shadow:0 1px 3px rgba(120,110,90,.05)}
  .panel .bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .panel .bname{font-size:13px;font-weight:600}
  .panel .btime{font-size:11px;color:var(--text-faint);font-family:monospace}
  .panel input[type=range]{width:100%;accent-color:var(--accent);height:4px;margin-bottom:9px}
  .moods{display:flex;gap:6px}
  .moods button{flex:1;border:none;background:var(--bg-card-alt);border-radius:8px;padding:5px 0;
    font-size:15px;cursor:pointer;opacity:.4;transition:.15s}
  .moods button.on{opacity:1;box-shadow:0 0 0 2px var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>情绪水晶球</h1>
  <div class="sub">四个水腔 = 四类效率活动 · 水位 = 投入时间 · 水色 = 主导情绪（MoodBlend 引擎）</div>

  <div class="stage">
    <div>
      <div class="ballWrap">
        <div class="backdrop"></div>
        <div class="ball">
          <div class="chamber tl"><div class="liquid" id="L0"><div class="wave" id="W0"></div></div></div>
          <div class="chamber tr"><div class="liquid" id="L1"><div class="wave" id="W1"></div></div></div>
          <div class="chamber bl"><div class="liquid" id="L2"><div class="wave" id="W2"></div></div></div>
          <div class="chamber br"><div class="liquid" id="L3"><div class="wave" id="W3"></div></div></div>
          <div class="divH"></div><div class="divV"></div>
          <div class="qlabel lbTL">创造性</div><div class="qlabel lbTR">生产性</div>
          <div class="qlabel lbBL">娱乐性</div><div class="qlabel lbBR">日常性</div>
          <div class="specular"></div><div class="rim"></div>
        </div>
      </div>
      <div class="insight" id="insight"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
/* ---- OKLab engine ---- */
function srgbToLin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
function linToSrgb(c){const v=c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;return Math.round(Math.min(1,Math.max(0,v))*255)}
function hexToRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToOklab(r,g,b){r=srgbToLin(r);g=srgbToLin(g);b=srgbToLin(b);
  const l=0.4122214708*r+0.5363325363*g+0.0514459929*b,m=0.2119034982*r+0.6806995451*g+0.1073969566*b,s=0.0883024619*r+0.2817188376*g+0.6299787005*b;
  const l_=Math.cbrt(l),m_=Math.cbrt(m),s_=Math.cbrt(s);
  return[0.2104542553*l_+0.7936177850*m_-0.0040720468*s_,1.9779984951*l_-2.4285922050*m_+0.4505937099*s_,0.0259040371*l_+0.7827717662*m_-0.8086757660*s_]}
function oklabToRgb(L,a,b){const l_=L+0.3963377774*a+0.2158037573*b,m_=L-0.1055613458*a-0.0638541728*b,s_=L-0.0894841775*a-1.2914855480*b;
  const l=l_**3,m=m_**3,s=s_**3;
  return[linToSrgb(4.0767416621*l-3.3077115913*m+0.2309699292*s),linToSrgb(-1.2684380046*l+2.6097574011*m-0.3413193965*s),linToSrgb(-0.0041960863*l-0.7034186147*m+1.7076147010*s)]}
const cssa=(rgb,a)=>`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
function variant(rgb,dL,mulC){let[L,a,b]=rgbToOklab(...rgb);const C=Math.hypot(a,b),H=Math.atan2(b,a);
  return oklabToRgb(Math.min(1,Math.max(0,L+dL)),Math.max(0,C*mulC)*Math.cos(H),Math.max(0,C*mulC)*Math.sin(H))}
function blend(items,w,chroma,dom){const wp=w.map(x=>Math.pow(x,dom));const t=wp.reduce((s,x)=>s+x,0);if(t<=0)return[213,208,196];
  let L=0,a=0,b=0;items.forEach((it,i)=>{const k=wp[i]/t;L+=k*it.oklab[0];a+=k*it.oklab[1];b+=k*it.oklab[2]});
  return oklabToRgb(L,a*chroma,b*chroma)}

/* ---- locked params (from liquid-lab decisions) ---- */
const CHROMA=3.2, DOM=3.5, DEPTH=0.55, ALPHA=0.82, WAVE=0.5, AMP=1+WAVE*4, DUR=(9-WAVE*6).toFixed(1);

/* ---- emotions & quadrants ---- */
const EMO=[{emo:'😊',nm:'愉悦',hex:'#A8BF94'},{emo:'😌',nm:'平静',hex:'#94ADBF'},{emo:'😐',nm:'还行',hex:'#BFB894'},{emo:'😔',nm:'低落',hex:'#B09BA8'},{emo:'😤',nm:'压力',hex:'#BF9A8A'}];
EMO.forEach(e=>{e.rgb=hexToRgb(e.hex);e.oklab=rgbToOklab(...e.rgb)});
const Q=[
  {name:'创造性',fill:60,mood:0},
  {name:'生产性',fill:95,mood:4},
  {name:'娱乐性',fill:42,mood:0},
  {name:'日常性',fill:72,mood:1},
];

function waveSVG(color,amp){const a=Math.max(1,amp);
  return `<svg viewBox="0 0 120 20" preserveAspectRatio="none"><path fill="${color}" d="M0 ${10-a} Q 15 ${10-a*2} 30 ${10-a} T 60 ${10-a} T 90 ${10-a} T 120 ${10-a} V20 H0 Z"/></svg>`.repeat(2)}

function renderBall(){
  Q.forEach((q,i)=>{
    const w=EMO.map((_,j)=>j===q.mood?100:0);
    const base=blend(EMO,w,CHROMA,DOM);
    const top=variant(base,+0.10*DEPTH,1-0.45*DEPTH);
    const bot=variant(base,-0.18*DEPTH,1+0.80*DEPTH);
    const liq=document.getElementById('L'+i);
    liq.style.height=q.fill+'%';
    liq.style.background=`linear-gradient(180deg,${cssa(top,ALPHA*0.88)} 0%,${cssa(base,ALPHA)} 45%,${cssa(bot,Math.min(1,ALPHA+0.08))} 100%)`;
    const wv=document.getElementById('W'+i);
    wv.innerHTML=waveSVG(cssa(top,ALPHA*0.9),AMP);
    wv.style.animation=`drift ${DUR}s linear infinite ${i%2?'reverse':''}`;
  });
  // insight: busiest quadrant + its mood
  const top=[...Q].sort((a,b)=>b.fill-a.fill)[0];
  document.getElementById('insight').innerHTML=`💡 <b>${top.name}</b>的时间最多，常伴 ${EMO[top.mood].emo}${EMO[top.mood].nm}`;
}

function renderPanel(){
  document.getElementById('panel').innerHTML=Q.map((q,i)=>`
    <div class="block">
      <div class="bhead"><span class="bname">${q.name}</span><span class="btime" id="t${i}"></span></div>
      <input type="range" min="0" max="100" value="${q.fill}" data-q="${i}">
      <div class="moods" data-m="${i}">
        ${EMO.map((e,j)=>`<button data-mi="${j}" class="${j===q.mood?'on':''}">${e.emo}</button>`).join('')}
      </div>
    </div>`).join('');
  Q.forEach((q,i)=>document.getElementById('t'+i).textContent=Math.round(q.fill/100*25)+'h');
  document.querySelectorAll('.panel input[type=range]').forEach(el=>el.addEventListener('input',e=>{
    const i=+e.target.dataset.q;Q[i].fill=+e.target.value;
    document.getElementById('t'+i).textContent=Math.round(Q[i].fill/100*25)+'h';renderBall();
  }));
  document.querySelectorAll('.moods').forEach(row=>row.addEventListener('click',e=>{
    if(e.target.tagName!=='BUTTON')return;const i=+row.dataset.m,mi=+e.target.dataset.mi;
    Q[i].mood=mi;row.querySelectorAll('button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');
    renderBall();
  }));
}
renderPanel();renderBall();
</script>
</body>
</html>
