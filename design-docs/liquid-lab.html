<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuli · 液体质感实验室</title>
<style>
  :root{
    --bg-page:#F3F1EA; --bg-card:#FBFAF6; --bg-card-alt:#EDEAE0;
    --border-soft:#E0DCD0; --text-primary:#3D3A32; --text-muted:#7A756A;
    --text-faint:#ABA599; --accent:#7A9B6E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-page);color:var(--text-primary);
    font-family:-apple-system,"PingFang SC","Quicksand",sans-serif;
    padding:28px 18px 80px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:22px;font-weight:600;margin-bottom:6px}
  .sub{color:var(--text-muted);font-size:13px;margin-bottom:26px}
  .stage{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:center}
  @media(max-width:600px){.stage{grid-template-columns:1fr}}

  /* backdrop so translucency is visible */
  .ballWrap{position:relative;width:240px;height:240px;margin:0 auto}
  .backdrop{position:absolute;inset:-30px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#DDE7D2,transparent 55%),
               radial-gradient(circle at 72% 68%,#E7D9C8,transparent 55%);
    filter:blur(4px)}
  .deco{position:absolute;border-radius:50%;background:var(--accent);opacity:.25}
  .d1{width:34px;height:34px;left:6px;top:40px}
  .d2{width:22px;height:22px;right:14px;bottom:30px;background:#C08A5E}

  /* the glass ball */
  .ball{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    box-shadow:0 12px 30px rgba(120,100,70,.22),
               inset 0 2px 6px rgba(255,255,255,.6),
               inset 0 -14px 26px rgba(90,70,50,.12);
    background:rgba(255,255,255,.06)}
  .liquid{position:absolute;left:-4%;right:-4%;bottom:0;
    transition:height .5s cubic-bezier(.4,1.2,.5,1)}
  .wave{position:absolute;left:0;top:-18px;width:200%;height:26px}
  .wave svg{width:50%;height:100%;display:block;float:left}
  .wave.w2{opacity:.5;top:-13px}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .specular{position:absolute;width:90px;height:60px;left:34px;top:30px;
    border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.75),transparent);
    filter:blur(3px);pointer-events:none;transform:rotate(-18deg)}
  .rim{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),
               inset 0 -6px 20px rgba(255,255,255,.15)}
  .bubble{position:absolute;bottom:8%;border-radius:50%;
    background:rgba(255,255,255,.4);animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0}
    15%{opacity:.6}100%{transform:translateY(-150px);opacity:0}}

  /* controls */
  .panel .row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .panel .lbl{width:96px;font-size:12px;display:flex;align-items:center;gap:5px}
  .panel .dot{width:11px;height:11px;border-radius:50%}
  .panel input[type=range]{flex:1;accent-color:var(--accent);height:4px}
  .panel .val{width:34px;text-align:right;font-size:11px;color:var(--text-muted);font-family:monospace}
  .divider{border-top:1px solid var(--border-soft);margin:14px 0 12px}
  .cap{font-size:11px;color:var(--text-faint);margin-bottom:10px}
  .code{font-size:10px;color:var(--text-faint);font-family:monospace;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>液体质感实验室</h1>
  <div class="sub">深度饱和渐变 + 波动水面 + 高光折射 · 拖滑块找到"就是这汪水"的手感</div>

  <div class="stage">
    <div>
      <div class="ballWrap">
        <div class="backdrop"></div>
        <div class="deco d1"></div><div class="deco d2"></div>
        <div class="ball">
          <div class="liquid" id="liquid">
            <div class="wave w1" id="wave1"></div>
            <div class="wave w2" id="wave2"></div>
          </div>
          <div class="specular" id="spec"></div>
          <div class="rim"></div>
        </div>
      </div>
      <div class="code" id="code"></div>
    </div>

    <div class="panel">
      <div class="cap">情绪时间占比 → 决定水的颜色</div>
      <div id="emo"></div>
      <div class="divider"></div>
      <div class="cap">液体物理参数 → 决定质感</div>
      <div class="row"><span class="lbl">液位</span><input type="range" id="fill" min="25" max="100" value="70"><span class="val" id="fillV">70</span></div>
      <div class="row"><span class="lbl">深度浓度</span><input type="range" id="depth" min="0" max="1" step="0.01" value="0.6"><span class="val" id="depthV">.60</span></div>
      <div class="row"><span class="lbl">透明度</span><input type="range" id="alpha" min="0.4" max="1" step="0.01" value="0.82"><span class="val" id="alphaV">.82</span></div>
      <div class="row"><span class="lbl">波动</span><input type="range" id="wave" min="0" max="1" step="0.01" value="0.5"><span class="val" id="waveV">.50</span></div>
      <div class="row"><span class="lbl">高光</span><input type="range" id="spc" min="0" max="1" step="0.01" value="0.7"><span class="val" id="spcV">.70</span></div>
      <div class="row"><span class="lbl">情绪浓度</span><input type="range" id="chroma" min="0.4" max="3.2" step="0.01" value="2.2"><span class="val" id="chromaV">2.20</span></div>
      <div class="row"><span class="lbl">主导偏向</span><input type="range" id="dom" min="1" max="3.5" step="0.05" value="1.7"><span class="val" id="domV">1.70</span></div>
    </div>
  </div>
</div>

<script>
/* ---- OKLab engine ---- */
function srgbToLin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
function linToSrgb(c){const v=c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;return Math.round(Math.min(1,Math.max(0,v))*255)}
function hexToRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToOklab(r,g,b){r=srgbToLin(r);g=srgbToLin(g);b=srgbToLin(b);
  const l=0.4122214708*r+0.5363325363*g+0.0514459929*b,m=0.2119034982*r+0.6806995451*g+0.1073969566*b,s=0.0883024619*r+0.2817188376*g+0.6299787005*b;
  const l_=Math.cbrt(l),m_=Math.cbrt(m),s_=Math.cbrt(s);
  return[0.2104542553*l_+0.7936177850*m_-0.0040720468*s_,1.9779984951*l_-2.4285922050*m_+0.4505937099*s_,0.0259040371*l_+0.7827717662*m_-0.8086757660*s_]}
function oklabToRgb(L,a,b){const l_=L+0.3963377774*a+0.2158037573*b,m_=L-0.1055613458*a-0.0638541728*b,s_=L-0.0894841775*a-1.2914855480*b;
  const l=l_**3,m=m_**3,s=s_**3;
  return[linToSrgb(4.0767416621*l-3.3077115913*m+0.2309699292*s),linToSrgb(-1.2684380046*l+2.6097574011*m-0.3413193965*s),linToSrgb(-0.0041960863*l-0.7034186147*m+1.7076147010*s)]}
const cssa=(rgb,a)=>`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;

/* depth variant: shift lightness & scale chroma in OKLab */
function variant(rgb,dL,mulC){let[L,a,b]=rgbToOklab(...rgb);const C=Math.hypot(a,b),H=Math.atan2(b,a);
  const L2=Math.min(1,Math.max(0,L+dL)),C2=Math.max(0,C*mulC);
  return oklabToRgb(L2,C2*Math.cos(H),C2*Math.sin(H))}
function blend(items,w,chroma,dom){
  const wp=w.map(x=>Math.pow(x,dom));
  const t=wp.reduce((s,x)=>s+x,0);if(t<=0)return[213,208,196];
  let L=0,a=0,b=0;items.forEach((it,i)=>{const k=wp[i]/t;L+=k*it.oklab[0];a+=k*it.oklab[1];b+=k*it.oklab[2]});
  return oklabToRgb(L,a*chroma,b*chroma)}

/* ---- emotion bases ---- */
const EMO=[{emo:'😊',nm:'愉悦',hex:'#A8BF94'},{emo:'😌',nm:'平静',hex:'#94ADBF'},{emo:'😐',nm:'还行',hex:'#BFB894'},{emo:'😔',nm:'低落',hex:'#B09BA8'},{emo:'😤',nm:'压力',hex:'#BF9A8A'}];
EMO.forEach(e=>{e.rgb=hexToRgb(e.hex);e.oklab=rgbToOklab(...e.rgb)});
const initW=[55,20,10,5,30];
document.getElementById('emo').innerHTML=EMO.map((e,i)=>`
  <div class="row"><span class="lbl"><span class="dot" style="background:${e.hex}"></span>${e.emo}${e.nm}</span>
  <input type="range" min="0" max="100" value="${initW[i]}" data-i="${i}"><span class="val" id="ev${i}">${initW[i]}</span></div>`).join('');

/* ---- wave svg builder ---- */
function waveSVG(color,amp){
  const a=Math.max(1,amp);
  return `<svg viewBox="0 0 120 26" preserveAspectRatio="none"><path fill="${color}" d="M0 ${13-a} Q 15 ${13-a*2} 30 ${13-a} T 60 ${13-a} T 90 ${13-a} T 120 ${13-a} V26 H0 Z"/></svg>`.repeat(2);
}

/* ---- render ---- */
function render(){
  const w=EMO.map((_,i)=>+document.querySelector(`input[data-i="${i}"]`).value);
  w.forEach((v,i)=>document.getElementById('ev'+i).textContent=v);
  const fill=+fillEl.value, depth=+depthEl.value, alpha=+alphaEl.value, wv=+waveEl.value, sp=+spcEl.value, chroma=+chromaEl.value, dom=+domEl.value;
  fillV.textContent=fill; depthV.textContent=depth.toFixed(2).slice(1); alphaV.textContent=alpha.toFixed(2).slice(1);
  waveV.textContent=wv.toFixed(2).slice(1); spcV.textContent=sp.toFixed(2).slice(1);
  chromaV.textContent=chroma.toFixed(2); domV.textContent=dom.toFixed(2);

  const base=blend(EMO,w,chroma,dom);
  const top=variant(base,+0.10*depth,1-0.45*depth);      // 水面：浅、淡
  const bot=variant(base,-0.18*depth,1+0.80*depth);      // 水底：深、浓
  const liquid=document.getElementById('liquid');
  liquid.style.height=fill+'%';
  liquid.style.background=`linear-gradient(180deg, ${cssa(top,alpha*0.88)} 0%, ${cssa(base,alpha)} 45%, ${cssa(bot,Math.min(1,alpha+0.08))} 100%)`;

  const amp=1+wv*4, dur=(9-wv*6).toFixed(1);
  const w1=document.getElementById('wave1'), w2=document.getElementById('wave2');
  w1.innerHTML=waveSVG(cssa(top,alpha*0.9),amp);
  w2.innerHTML=waveSVG(cssa(top,alpha*0.6),amp*0.6);
  w1.style.animation=`drift ${dur}s linear infinite`;
  w2.style.animation=`drift ${(dur*1.7).toFixed(1)}s linear infinite reverse`;

  document.getElementById('spec').style.opacity=sp;
  document.getElementById('code').textContent=`rgb(${base.join(',')}) · 液位${fill}% · 浓度${depth.toFixed(2)} · α${alpha.toFixed(2)}`;
}

const fillEl=document.getElementById('fill'),depthEl=document.getElementById('depth'),alphaEl=document.getElementById('alpha'),
  waveEl=document.getElementById('wave'),spcEl=document.getElementById('spc'),chromaEl=document.getElementById('chroma'),domEl=document.getElementById('dom');
const fillV=document.getElementById('fillV'),depthV=document.getElementById('depthV'),alphaV=document.getElementById('alphaV'),
  waveV=document.getElementById('waveV'),spcV=document.getElementById('spcV'),chromaV=document.getElementById('chromaV'),domV=document.getElementById('domV');
document.querySelectorAll('.panel input').forEach(el=>el.addEventListener('input',render));

/* bubbles */
const ball=document.querySelector('.ball');
for(let i=0;i<5;i++){const b=document.createElement('div');b.className='bubble';
  const sz=3+Math.random()*5;b.style.width=b.style.height=sz+'px';
  b.style.left=(20+Math.random()*60)+'%';b.style.animationDuration=(4+Math.random()*4)+'s';
  b.style.animationDelay=(Math.random()*4)+'s';ball.appendChild(b)}

render();
</script>
</body>
</html>
