<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eutide · 打标签界面</title>
<style>
  :root{
    --bg-page:#F3F1EA; --bg-card:#FBFAF6; --bg-card-alt:#EDEAE0;
    --border-soft:#E0DCD0; --text-primary:#3D3A32; --text-muted:#7A756A;
    --text-faint:#ABA599; --accent:#7A9B6E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-page);color:var(--text-primary);
    font-family:-apple-system,"PingFang SC","Quicksand",sans-serif;
    padding:28px 18px 70px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:420px;margin:0 auto}
  h1{font-size:21px;font-weight:600;margin-bottom:4px}
  .sub{color:var(--text-muted);font-size:13px;margin-bottom:24px}

  .sheet{background:var(--bg-card);border-radius:18px;padding:18px;margin-bottom:22px;
    box-shadow:0 3px 12px rgba(120,110,90,.08)}
  .sheetTag{font-size:11px;font-weight:600;color:var(--text-faint);letter-spacing:.5px;margin-bottom:12px}

  /* context header mock */
  .ctx{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--border-soft)}
  .ctx .dot{width:12px;height:12px;border-radius:50%;background:#C08A5E}
  .ctx .nm{font-size:15px;font-weight:600}
  .ctx .time{font-size:12px;color:var(--text-muted);margin-left:auto;font-family:monospace}

  .q{font-size:15px;font-weight:600;margin-bottom:3px}
  .qhint{font-size:12px;color:var(--text-faint);margin-bottom:16px}

  /* emotion picker */
  .moods{display:flex;gap:8px}
  .mood{flex:1;background:var(--bg-card-alt);border:1.5px solid transparent;border-radius:14px;
    padding:12px 4px;text-align:center;cursor:pointer;transition:.18s}
  .mood .emo{font-size:26px;line-height:1}
  .mood .lb{font-size:11px;color:var(--text-muted);margin-top:6px}
  .mood.on{transform:translateY(-2px)}
  .mood.on .lb{color:var(--text-primary);font-weight:600}
  .skip{margin-top:14px;text-align:center}
  .skip button{background:none;border:none;color:var(--text-faint);font-size:12px;cursor:pointer;
    font-family:inherit;text-decoration:underline;text-underline-offset:3px}
  .moodState{margin-top:12px;font-size:12px;color:var(--text-muted);text-align:center;min-height:16px}

  /* efficiency tags */
  .effGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .eff{background:var(--bg-card-alt);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;
    cursor:pointer;transition:.18s;position:relative}
  .eff .top{display:flex;align-items:center;gap:8px}
  .eff .cdot{width:12px;height:12px;border-radius:50%}
  .eff .nm{font-size:15px;font-weight:600}
  .eff .desc{font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.4}
  .eff .chk{position:absolute;top:11px;right:12px;width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;opacity:0;transition:.18s}
  .eff.on .chk{opacity:1}
  .eff.disabled{opacity:.42;cursor:default}
  .effHint{font-size:12px;color:var(--text-faint);margin-top:14px;text-align:center;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>打标签界面</h1>
  <div class="sub">标签进入数据的两个入口 · emoji 只在这里出现</div>

  <!-- 1. emotion at recording -->
  <div class="sheet">
    <div class="sheetTag">记录时 · 情绪</div>
    <div class="ctx"><span class="dot"></span><span class="nm">英语学习</span><span class="time">14:00–15:30</span></div>
    <div class="q">这段时间，心情怎么样？</div>
    <div class="qhint">想标就标，忘了也没关系</div>
    <div class="moods" id="moods"></div>
    <div class="moodState" id="moodState"></div>
    <div class="skip"><button id="skipBtn">先不标</button></div>
  </div>

  <!-- 2. efficiency at activity setup -->
  <div class="sheet">
    <div class="sheetTag">活动设置 · 效率标签</div>
    <div class="ctx"><span class="dot" style="background:#8A7BA8"></span><span class="nm">写代码</span></div>
    <div class="q">这个活动属于哪种效率？</div>
    <div class="qhint">最多选 2 个 · 这段时间会同时计入所选的类别</div>
    <div class="effGrid" id="effGrid"></div>
    <div class="effHint" id="effHint"></div>
  </div>
</div>

<script>
// ---- emotion picker (single select, optional) ----
const EMO=[
  {emo:'😊',nm:'愉悦',hex:'#A8BF94'},
  {emo:'😌',nm:'平静',hex:'#94ADBF'},
  {emo:'😐',nm:'还行',hex:'#BFB894'},
  {emo:'😔',nm:'低落',hex:'#B09BA8'},
  {emo:'😤',nm:'压力',hex:'#BF9A8A'},
];
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
let moodSel=null;
const moodsEl=document.getElementById('moods'),moodState=document.getElementById('moodState');
EMO.forEach((e,i)=>{
  const d=document.createElement('div');d.className='mood';
  d.innerHTML=`<div class="emo">${e.emo}</div><div class="lb">${e.nm}</div>`;
  d.addEventListener('click',()=>{
    if(moodSel===i){moodSel=null}else{moodSel=i}
    renderMoods();
  });
  moodsEl.appendChild(d);
});
function renderMoods(){
  [...moodsEl.children].forEach((d,i)=>{
    const on=moodSel===i;d.classList.toggle('on',on);
    d.style.background=on?hexA(EMO[i].hex,.3):'';
    d.style.borderColor=on?EMO[i].hex:'transparent';
  });
  moodState.textContent=moodSel===null?'':`记为「${EMO[moodSel].nm}」`;
}
document.getElementById('skipBtn').addEventListener('click',()=>{moodSel=null;renderMoods()});
renderMoods();

// ---- efficiency tags (multi, max 2) ----
const EFF=[
  {nm:'生产',hex:'#8A7BA8',desc:'为了完成：工作、任务、交付'},
  {nm:'创造',hex:'#C08A5E',desc:'为了成长：创作、搭建、学本领'},
  {nm:'娱乐',hex:'#7A9B6E',desc:'为了放松：玩、看剧、消遣'},
  {nm:'日常',hex:'#7D93A8',desc:'为了生活：吃饭、通勤、家务'},
];
let effSel=[1];  // 默认"写代码"=创造，示例
const effGrid=document.getElementById('effGrid'),effHint=document.getElementById('effHint');
EFF.forEach((e,i)=>{
  const d=document.createElement('div');d.className='eff';
  d.innerHTML=`<span class="chk" style="background:${e.hex}">✓</span>
    <div class="top"><span class="cdot" style="background:${e.hex}"></span><span class="nm">${e.nm}</span></div>
    <div class="desc">${e.desc}</div>`;
  d.addEventListener('click',()=>{
    const at=effSel.indexOf(i);
    if(at>=0){effSel.splice(at,1)}
    else if(effSel.length<2){effSel.push(i)}
    else{flash();return}
    renderEff();
  });
  effGrid.appendChild(d);
});
function renderEff(){
  [...effGrid.children].forEach((d,i)=>{
    const on=effSel.includes(i);d.classList.toggle('on',on);
    const full=effSel.length>=2&&!on;d.classList.toggle('disabled',full);
    d.style.background=on?hexA(EFF[i].hex,.14):'';
    d.style.borderColor=on?EFF[i].hex:'transparent';
  });
  if(effSel.length===0)effHint.textContent='至少选一个';
  else effHint.textContent=`写代码 = ${effSel.map(i=>EFF[i].nm).join(' + ')}`;
}
let flashT;
function flash(){effHint.textContent='最多选 2 个，先取消一个吧';clearTimeout(flashT);flashT=setTimeout(renderEff,1400)}
renderEff();
</script>
</body>
</html>
