<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuli · 水晶球联动</title>
<style>
  :root{
    --bg-page:#F3F1EA; --bg-card:#FBFAF6; --bg-card-alt:#EDEAE0;
    --border-soft:#E0DCD0; --text-primary:#3D3A32; --text-muted:#7A756A;
    --text-faint:#ABA599; --accent:#7A9B6E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-page);color:var(--text-primary);
    font-family:-apple-system,"PingFang SC","Quicksand",sans-serif;
    padding:28px 18px 70px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;font-weight:600;margin-bottom:4px}
  .sub{color:var(--text-muted);font-size:13px;margin-bottom:26px}

  .balls{display:flex;gap:30px;justify-content:center;margin-bottom:8px}
  .orbUnit{display:flex;flex-direction:column;align-items:center}
  .orb{position:relative;width:188px;height:188px;border-radius:50%;overflow:hidden;
    box-shadow:0 14px 32px rgba(120,100,70,.22),inset 0 2px 7px rgba(255,255,255,.6),inset 0 -14px 26px rgba(90,70,50,.1);
    background:rgba(255,255,255,.05)}
  .half{position:absolute;top:0;height:100%;width:50%;overflow:hidden;cursor:pointer}
  .half.l{left:0} .half.r{right:0}
  .liquid{position:absolute;left:-4%;right:-4%;bottom:0;transition:height .55s cubic-bezier(.4,1.1,.5,1),opacity .3s,filter .3s}
  .wave{position:absolute;left:0;top:-13px;width:200%;height:18px}
  .wave svg{width:50%;height:100%;display:block;float:left}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .half.dim .liquid{opacity:.4}
  .half.sel .liquid{filter:brightness(1.1) saturate(1.08)}
  .divV{position:absolute;top:4%;bottom:4%;left:50%;width:1.5px;transform:translateX(-50%);z-index:5;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.55),transparent)}
  .specular{position:absolute;width:60px;height:38px;left:22px;top:18px;border-radius:50%;z-index:6;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,255,255,.72),transparent);filter:blur(3px);transform:rotate(-18deg)}
  .rim{position:absolute;inset:0;border-radius:50%;z-index:6;pointer-events:none;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4),inset 0 -7px 18px rgba(255,255,255,.12)}
  .selRing{position:absolute;inset:-5px;border-radius:50%;z-index:7;pointer-events:none;opacity:0;transition:.3s;
    box-shadow:0 0 0 2px var(--accent),0 0 16px rgba(122,155,110,.5)}
  .orb.has .selRing{opacity:1}

  .cap .pair{display:flex;justify-content:center;margin-top:9px}
  .cap .pair span{width:94px;text-align:center;font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:.2s}
  .cap .pair span.on{color:var(--text-primary)}
  .faceLabel{font-size:11px;color:var(--text-faint);text-align:center;margin-top:3px;letter-spacing:.5px}

  /* detail */
  .detail{margin-top:26px;min-height:140px}
  .dhint{text-align:center;color:var(--text-faint);font-size:13px;padding:40px 0;transition:.3s}
  .dcard{background:var(--bg-card);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(120,110,90,.07);
    opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s}
  .dcard.show{opacity:1;transform:translateY(0)}
  .dtitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .dtitle .nm{font-size:16px;font-weight:600}
  .dtitle .tot{font-size:13px;color:var(--text-muted);font-family:monospace}
  .bar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-bottom:12px;background:var(--bg-card-alt)}
  .seg{height:100%;width:0;transition:width .6s cubic-bezier(.4,1,.5,1)}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:14px}
  .legend .it{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-muted)}
  .legend .dot{width:10px;height:10px;border-radius:50%}
  .suggest{font-size:13px;color:var(--text-primary);background:var(--bg-card-alt);
    border-radius:10px;padding:10px 12px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>水晶球 · 远景近景联动</h1>
  <div class="sub">点任意一腔水，展开它的情绪明细</div>

  <div class="balls">
    <div class="orbUnit">
      <div class="orb" id="orbA">
        <div class="half l" data-cat="1"><div class="liquid" id="L1"><div class="wave" id="W1"></div></div></div>
        <div class="half r" data-cat="3"><div class="liquid" id="L3"><div class="wave" id="W3"></div></div></div>
        <div class="divV"></div><div class="specular"></div><div class="rim"></div><div class="selRing"></div>
      </div>
      <div class="cap"><div class="pair"><span data-cat="1">生产性</span><span data-cat="3">日常性</span></div></div>
      <div class="faceLabel">刚需面</div>
    </div>
    <div class="orbUnit">
      <div class="orb" id="orbB">
        <div class="half l" data-cat="0"><div class="liquid" id="L0"><div class="wave" id="W0"></div></div></div>
        <div class="half r" data-cat="2"><div class="liquid" id="L2"><div class="wave" id="W2"></div></div></div>
        <div class="divV"></div><div class="specular"></div><div class="rim"></div><div class="selRing"></div>
      </div>
      <div class="cap"><div class="pair"><span data-cat="0">创造性</span><span data-cat="2">娱乐性</span></div></div>
      <div class="faceLabel">消遣面</div>
    </div>
  </div>

  <div class="detail">
    <div class="dhint" id="dhint">↑ 点一腔水，看看那段时间的心情</div>
    <div class="dcard" id="dcard">
      <div class="dtitle"><span class="nm" id="dnm"></span><span class="tot" id="dtot"></span></div>
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
      <div class="suggest" id="suggest"></div>
    </div>
  </div>
</div>

<script>
function srgbToLin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
function linToSrgb(c){const v=c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;return Math.round(Math.min(1,Math.max(0,v))*255)}
function hexToRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToOklab(r,g,b){r=srgbToLin(r);g=srgbToLin(g);b=srgbToLin(b);
  const l=0.4122214708*r+0.5363325363*g+0.0514459929*b,m=0.2119034982*r+0.6806995451*g+0.1073969566*b,s=0.0883024619*r+0.2817188376*g+0.6299787005*b;
  const l_=Math.cbrt(l),m_=Math.cbrt(m),s_=Math.cbrt(s);
  return[0.2104542553*l_+0.7936177850*m_-0.0040720468*s_,1.9779984951*l_-2.4285922050*m_+0.4505937099*s_,0.0259040371*l_+0.7827717662*m_-0.8086757660*s_]}
function oklabToRgb(L,a,b){const l_=L+0.3963377774*a+0.2158037573*b,m_=L-0.1055613458*a-0.0638541728*b,s_=L-0.0894841775*a-1.2914855480*b;
  const l=l_**3,m=m_**3,s=s_**3;
  return[linToSrgb(4.0767416621*l-3.3077115913*m+0.2309699292*s),linToSrgb(-1.2684380046*l+2.6097574011*m-0.3413193965*s),linToSrgb(-0.0041960863*l-0.7034186147*m+1.7076147010*s)]}
const cssa=(rgb,a)=>`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`,css=rgb=>`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
function variant(rgb,dL,mulC){let[L,a,b]=rgbToOklab(...rgb);const C=Math.hypot(a,b),H=Math.atan2(b,a);
  return oklabToRgb(Math.min(1,Math.max(0,L+dL)),Math.max(0,C*mulC)*Math.cos(H),Math.max(0,C*mulC)*Math.sin(H))}
function blend(items,w,chroma,dom){const wp=w.map(x=>Math.pow(x,dom));const t=wp.reduce((s,x)=>s+x,0);if(t<=0)return[213,208,196];
  let L=0,a=0,b=0;items.forEach((it,i)=>{const k=wp[i]/t;L+=k*it.oklab[0];a+=k*it.oklab[1];b+=k*it.oklab[2]});
  return oklabToRgb(L,a*chroma,b*chroma)}

const CHROMA=3.2,DOM=3.5,DEPTH=0.55,ALPHA=0.82,WAVE=0.5,AMP=1+WAVE*4,DUR=(9-WAVE*6).toFixed(1);
const EMO=[{emo:'😊',nm:'愉悦',hex:'#A8BF94'},{emo:'😌',nm:'平静',hex:'#94ADBF'},{emo:'😐',nm:'还行',hex:'#BFB894'},{emo:'😔',nm:'低落',hex:'#B09BA8'},{emo:'😤',nm:'压力',hex:'#BF9A8A'}];
EMO.forEach(e=>{e.rgb=hexToRgb(e.hex);e.oklab=rgbToOklab(...e.rgb)});
EMO.forEach((e,k)=>{e.vivid=blend(EMO,EMO.map((_,i)=>i===k?1:0),CHROMA,DOM)});
// moods order: [愉悦,平静,还行,低落,压力]
const CAT=[
  {name:'创造性',moods:[1.5,0.5,0,0,0],noMood:0},
  {name:'生产性',moods:[0.5,1.5,3,1,3],noMood:0.5},
  {name:'娱乐性',moods:[1,0,0.5,0,0],noMood:0},
  {name:'日常性',moods:[0.5,3,3,0.5,0],noMood:0.5},
];
const LMAP=[{l:'L0',w:'W0',c:0},{l:'L1',w:'W1',c:1},{l:'L2',w:'W2',c:2},{l:'L3',w:'W3',c:3}];
const total=c=>c.moods.reduce((s,x)=>s+x,0)+c.noMood;

function waveSVG(color){const a=AMP;
  return `<svg viewBox="0 0 120 18" preserveAspectRatio="none"><path fill="${color}" d="M0 ${9-a} Q 15 ${9-a*2} 30 ${9-a} T 60 ${9-a} T 90 ${9-a} T 120 ${9-a} V18 H0 Z"/></svg>`.repeat(2)}

function paintBall(){
  LMAP.forEach((m,i)=>{
    const c=CAT[m.c];
    const base=blend(EMO,c.moods,CHROMA,DOM);
    const top=variant(base,+0.10*DEPTH,1-0.45*DEPTH),bot=variant(base,-0.18*DEPTH,1+0.80*DEPTH);
    const liq=document.getElementById(m.l);
    liq.style.height=Math.min(100,total(c)/24*100)+'%';
    liq.style.background=`linear-gradient(180deg,${cssa(top,ALPHA*.88)} 0%,${cssa(base,ALPHA)} 45%,${cssa(bot,Math.min(1,ALPHA+.08))} 100%)`;
    const wv=document.getElementById(m.w);wv.innerHTML=waveSVG(cssa(top,ALPHA*.9));
    wv.style.animation=`drift ${DUR}s linear infinite ${i%2?'reverse':''}`;
  });
}

let sel=null;
function fmt(h){return (h%1?h.toFixed(1):h)+'h'}
function selectCat(ci){
  sel=ci;
  // highlight
  document.querySelectorAll('.half').forEach(h=>{
    const on=+h.dataset.cat===ci;h.classList.toggle('sel',on);h.classList.toggle('dim',!on);
  });
  document.querySelectorAll('.cap .pair span').forEach(s=>s.classList.toggle('on',+s.dataset.cat===ci));
  document.getElementById('orbA').classList.toggle('has',ci===1||ci===3);
  document.getElementById('orbB').classList.toggle('has',ci===0||ci===2);
  // detail
  const c=CAT[ci],tot=total(c);
  document.getElementById('dhint').style.display='none';
  const card=document.getElementById('dcard');card.classList.add('show');
  document.getElementById('dnm').textContent=c.name;
  document.getElementById('dtot').textContent=fmt(tot);
  // bar segments (warm first = natural order), gray tail for noMood
  const bar=document.getElementById('bar');bar.innerHTML='';
  const segs=[];
  EMO.forEach((e,j)=>{if(c.moods[j]>0)segs.push({color:css(e.vivid),h:c.moods[j]})});
  if(c.noMood>0)segs.push({color:'#D2CEC4',h:c.noMood});
  segs.forEach(s=>{const d=document.createElement('div');d.className='seg';d.style.background=s.color;bar.appendChild(d);d._w=s.h/tot*100});
  requestAnimationFrame(()=>bar.querySelectorAll('.seg').forEach(d=>d.style.width=d._w+'%'));
  // legend
  const lg=document.getElementById('legend');lg.innerHTML='';
  EMO.forEach((e,j)=>{if(c.moods[j]>0){const it=document.createElement('div');it.className='it';
    it.innerHTML=`<span class="dot" style="background:${css(e.vivid)}"></span>${e.emo}${e.nm} ${fmt(c.moods[j])}`;lg.appendChild(it)}});
  if(c.noMood>0){const it=document.createElement('div');it.className='it';
    it.innerHTML=`<span class="dot" style="background:#D2CEC4"></span>没标心情 ${fmt(c.noMood)}`;lg.appendChild(it)}
  // suggestion
  const stress=c.moods[4]/tot,joy=c.moods[0]/tot;
  let msg;
  if(stress>=0.3)msg='💡 这类事让你压力偏多，试试给相关目标调高奖励份额？';
  else if(joy>=0.4)msg='🌱 这类时间常带来愉悦，可以安心多留一点给自己。';
  else msg='😌 情绪挺平稳的，保持这个节奏就好。';
  document.getElementById('suggest').textContent=msg;
}

document.querySelectorAll('.half').forEach(h=>h.addEventListener('click',()=>selectCat(+h.dataset.cat)));
document.querySelectorAll('.cap .pair span').forEach(s=>s.addEventListener('click',()=>selectCat(+s.dataset.cat)));
paintBall();
</script>
</body>
</html>
