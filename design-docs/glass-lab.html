<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eutide · 玻璃折射实验室 v2</title>
<style>
  :root{
    --bg-page:#F3F1EA; --bg-card:#FBFAF6; --bg-card-alt:#EDEAE0;
    --border-soft:#E0DCD0; --text-primary:#3D3A32; --text-muted:#7A756A;
    --text-faint:#ABA599; --accent:#7A9B6E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-page);color:var(--text-primary);
    font-family:-apple-system,"PingFang SC","Quicksand",sans-serif;
    padding:26px 18px 70px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto}
  h1{font-size:22px;font-weight:600;margin-bottom:4px}
  .sub{color:var(--text-muted);font-size:13px;margin-bottom:22px}
  .stage{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center}
  @media(max-width:620px){.stage{grid-template-columns:1fr}}

  .ballWrap{width:280px;height:280px;margin:0 auto;
    background:radial-gradient(circle at 50% 50%,#E7E2D6,transparent 70%)}
  .ball{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
    box-shadow:0 20px 44px rgba(90,70,50,.3);
    --mag:1.3; --blur:1.5; --fresnel:.6; --hl:.82; --caustic:.55; --ab:.5; --tint:.05}

  /* refracted inner medium (clearly visible, magnified + blurred by sliders) */
  .lens{position:absolute;inset:0;
    background:
      radial-gradient(circle at 30% 30%, #86B59E 0 22%, transparent 46%),
      radial-gradient(circle at 76% 26%, #E0A878 0 20%, transparent 44%),
      radial-gradient(circle at 70% 74%, #B589C0 0 20%, transparent 44%),
      radial-gradient(circle at 26% 76%, #7FA8CC 0 20%, transparent 44%),
      linear-gradient(135deg,#ECE6D8,#E1DBCD);
    background-size:calc(150% * var(--mag)) calc(150% * var(--mag));
    background-position:center;
    filter:blur(calc(var(--blur) * 1px));
    animation:swirl 22s linear infinite}
  @keyframes swirl{from{background-position:46% 48%}50%{background-position:54% 52%}to{background-position:46% 48%}}

  .liquid{position:absolute;left:-5%;right:-5%;bottom:0;height:58%;opacity:.9}
  .wave{position:absolute;left:0;top:-15px;width:200%;height:22px}
  .wave svg{width:50%;height:100%;display:block;float:left}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .caustic{position:absolute;left:16%;right:16%;bottom:5%;height:36%;border-radius:50%;pointer-events:none;
    background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,var(--caustic)),transparent 68%);filter:blur(7px)}
  .fresnel{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,transparent 58%,rgba(255,255,255,calc(var(--fresnel)*.85)) 86%,rgba(255,255,255,calc(var(--fresnel)*.25)) 100%)}
  .hl{position:absolute;width:124px;height:80px;left:40px;top:28px;border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,255,255,var(--hl)),transparent);filter:blur(2px);transform:rotate(-20deg)}
  .hot{position:absolute;width:30px;height:22px;left:66px;top:42px;border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,#fff,transparent);opacity:var(--hl)}
  .aberr{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    box-shadow:inset 3px 0 5px rgba(255,30,90,var(--ab)),inset -3px 0 5px rgba(30,120,255,var(--ab))}
  .tintL{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:rgba(255,255,255,var(--tint))}
  .rim{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    box-shadow:inset 0 3px 9px rgba(255,255,255,.65),inset 0 -14px 26px rgba(70,55,40,.16),inset 0 0 0 1px rgba(255,255,255,.35)}

  .panel .row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .panel .lbl{width:84px;font-size:12px}
  .panel input[type=range]{flex:1;accent-color:var(--accent);height:4px}
  .panel .val{width:38px;text-align:right;font-size:11px;color:var(--text-muted);font-family:monospace}
  .note{font-size:11px;color:var(--text-faint);margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>玻璃折射实验室 v2</h1>
  <div class="sub">球内有彩色介质 · 每个滑块都真实作用在可见图层上 · 定了再烘焙进四球</div>

  <div class="stage">
    <div class="ballWrap">
      <div class="ball" id="ball">
        <div class="lens"></div>
        <div class="liquid" id="liquid"><div class="wave" id="wave"></div></div>
        <div class="tintL"></div>
        <div class="caustic"></div>
        <div class="fresnel"></div>
        <div class="hl"></div><div class="hot"></div>
        <div class="aberr"></div>
        <div class="rim"></div>
      </div>
    </div>

    <div class="panel">
      <div class="row"><span class="lbl">折射放大</span><input type="range" id="mag" min="1" max="2.4" step="0.01" value="1.3"><span class="val" id="magV">1.30</span></div>
      <div class="row"><span class="lbl">磨砂模糊</span><input type="range" id="blur" min="0" max="10" step="0.1" value="1.5"><span class="val" id="blurV">1.5</span></div>
      <div class="row"><span class="lbl">边缘高光</span><input type="range" id="fresnel" min="0" max="1" step="0.01" value="0.6"><span class="val" id="fresnelV">.60</span></div>
      <div class="row"><span class="lbl">主高光</span><input type="range" id="hl" min="0" max="1" step="0.01" value="0.82"><span class="val" id="hlV">.82</span></div>
      <div class="row"><span class="lbl">底部聚光</span><input type="range" id="caustic" min="0" max="1" step="0.01" value="0.55"><span class="val" id="causticV">.55</span></div>
      <div class="row"><span class="lbl">色散</span><input type="range" id="ab" min="0" max="1" step="0.01" value="0.5"><span class="val" id="abV">.50</span></div>
      <div class="row"><span class="lbl">玻璃色调</span><input type="range" id="tint" min="0" max="0.25" step="0.01" value="0.05"><span class="val" id="tintV">.05</span></div>
      <div class="note">折射放大 = 球内彩色介质被放大；磨砂 = 直接模糊它。<br>两个一起拉，就是"透过厚玻璃看里面"的感觉。</div>
    </div>
  </div>
</div>

<script>
function srgbToLin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
function linToSrgb(c){const v=c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;return Math.round(Math.min(1,Math.max(0,v))*255)}
function hexToRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToOklab(r,g,b){r=srgbToLin(r);g=srgbToLin(g);b=srgbToLin(b);
  const l=0.4122214708*r+0.5363325363*g+0.0514459929*b,m=0.2119034982*r+0.6806995451*g+0.1073969566*b,s=0.0883024619*r+0.2817188376*g+0.6299787005*b;
  const l_=Math.cbrt(l),m_=Math.cbrt(m),s_=Math.cbrt(s);
  return[0.2104542553*l_+0.7936177850*m_-0.0040720468*s_,1.9779984951*l_-2.4285922050*m_+0.4505937099*s_,0.0259040371*l_+0.7827717662*m_-0.8086757660*s_]}
function oklabToRgb(L,a,b){const l_=L+0.3963377774*a+0.2158037573*b,m_=L-0.1055613458*a-0.0638541728*b,s_=L-0.0894841775*a-1.2914855480*b;
  const l=l_**3,m=m_**3,s=s_**3;
  return[linToSrgb(4.0767416621*l-3.3077115913*m+0.2309699292*s),linToSrgb(-1.2684380046*l+2.6097574011*m-0.3413193965*s),linToSrgb(-0.0041960863*l-0.7034186147*m+1.7076147010*s)]}
const cssa=(rgb,a)=>`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
function variant(rgb,dL,mulC){let[L,a,b]=rgbToOklab(...rgb);const C=Math.hypot(a,b),H=Math.atan2(b,a);
  return oklabToRgb(Math.min(1,Math.max(0,L+dL)),Math.max(0,C*mulC)*Math.cos(H),Math.max(0,C*mulC)*Math.sin(H))}
function blend(items,w,chroma,dom){const wp=w.map(x=>Math.pow(x,dom));const t=wp.reduce((s,x)=>s+x,0);
  let L=0,a=0,b=0;items.forEach((it,i)=>{const k=wp[i]/t;L+=k*it.oklab[0];a+=k*it.oklab[1];b+=k*it.oklab[2]});
  return oklabToRgb(L,a*chroma,b*chroma)}
const CHROMA=3.2,DOM=3.5,DEPTH=0.55,ALPHA=0.82;
const EMO=[{hex:'#A8BF94'},{hex:'#94ADBF'},{hex:'#BFB894'},{hex:'#B09BA8'},{hex:'#BF9A8A'}];
EMO.forEach(e=>e.oklab=rgbToOklab(...hexToRgb(e.hex)));
const base=blend(EMO,[8,2,1,0,0],CHROMA,DOM);
const top=variant(base,+0.10*DEPTH,1-0.45*DEPTH),bot=variant(base,-0.18*DEPTH,1+0.80*DEPTH);
const liquid=document.getElementById('liquid');
liquid.style.background=`linear-gradient(180deg,${cssa(top,ALPHA*.88)} 0%,${cssa(base,ALPHA)} 45%,${cssa(bot,Math.min(1,ALPHA+.08))} 100%)`;
const a=3;
document.getElementById('wave').innerHTML=`<svg viewBox="0 0 120 22" preserveAspectRatio="none"><path fill="${cssa(top,ALPHA*.9)}" d="M0 ${11-a} Q 15 ${11-a*2} 30 ${11-a} T 60 ${11-a} T 90 ${11-a} T 120 ${11-a} V22 H0 Z"/></svg>`.repeat(2);
document.getElementById('wave').style.animation='drift 6s linear infinite';

const ball=document.getElementById('ball');
const keys=['mag','blur','fresnel','hl','caustic','ab','tint'];
function upd(){
  keys.forEach(k=>{
    const v=document.getElementById(k).value;
    document.getElementById(k+'V').textContent=(k==='blur')?(+v).toFixed(1):(k==='mag'?(+v).toFixed(2):(+v).toFixed(2).replace(/^0/,''));
    ball.style.setProperty('--'+k, v);
  });
}
keys.forEach(k=>document.getElementById(k).addEventListener('input',upd));
upd();
</script>
</body>
</html>
