<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuli · 情绪水晶球 v2</title>
<style>
  :root{
    --bg-page:#F3F1EA; --bg-card:#FBFAF6; --bg-card-alt:#EDEAE0;
    --border-soft:#E0DCD0; --text-primary:#3D3A32; --text-muted:#7A756A;
    --text-faint:#ABA599; --accent:#7A9B6E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-page);color:var(--text-primary);
    font-family:-apple-system,"PingFang SC","Quicksand",sans-serif;
    padding:26px 18px 70px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:22px;font-weight:600;margin-bottom:4px}
  .sub{color:var(--text-muted);font-size:13px;margin-bottom:22px}
  .stage{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
  @media(max-width:680px){.stage{grid-template-columns:1fr}}

  .planTitle{font-size:12px;font-weight:600;color:var(--text-faint);margin:4px 0 12px;letter-spacing:.5px}
  .orbRow{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;margin-bottom:30px}

  .orb{position:relative;border-radius:50%;overflow:hidden;
    box-shadow:0 14px 32px rgba(120,100,70,.22),
               inset 0 2px 7px rgba(255,255,255,.6),
               inset 0 -14px 26px rgba(90,70,50,.1);
    background:rgba(255,255,255,.05)}
  .big{width:190px;height:190px} .small{width:118px;height:118px}
  .half{position:absolute;top:0;height:100%;width:50%;overflow:hidden}
  .half.l{left:0} .half.r{right:0}
  .liquid{position:absolute;left:-4%;right:-4%;bottom:0;transition:height .55s cubic-bezier(.4,1.1,.5,1)}
  .wave{position:absolute;left:0;top:-13px;width:200%;height:18px}
  .wave svg{width:50%;height:100%;display:block;float:left}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .divV{position:absolute;top:4%;bottom:4%;left:50%;width:1.5px;transform:translateX(-50%);z-index:5;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.55),transparent)}
  .specular{position:absolute;width:62px;height:40px;left:24px;top:20px;border-radius:50%;z-index:6;
    background:radial-gradient(closest-side,rgba(255,255,255,.72),transparent);filter:blur(3px);transform:rotate(-18deg)}
  .small .specular{width:40px;height:26px;left:16px;top:13px}
  .rim{position:absolute;inset:0;border-radius:50%;z-index:6;pointer-events:none;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4),inset 0 -7px 18px rgba(255,255,255,.12)}

  .cap{text-align:center;font-size:12px;margin-top:9px}
  .cap .pair{display:flex;gap:0;justify-content:center}
  .cap .pair span{width:95px;color:var(--text-muted);font-weight:600}
  .capOne{font-size:11.5px;color:var(--text-muted);font-weight:600;text-align:center;margin-top:7px}
  .orbUnit{display:flex;flex-direction:column;align-items:center}

  .insight{font-size:13px;color:var(--text-muted);margin-top:4px}
  .insight b{color:var(--text-primary);font-weight:600}

  .panel .block{background:var(--bg-card);border-radius:14px;padding:12px 14px;margin-bottom:10px;
    box-shadow:0 1px 3px rgba(120,110,90,.05)}
  .panel .bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .panel .bname{font-size:13px;font-weight:600}
  .panel .btime{font-size:11px;color:var(--text-faint);font-family:monospace}
  .panel input[type=range]{width:100%;accent-color:var(--accent);height:4px;margin-bottom:8px}
  .moods{display:flex;gap:5px}
  .moods button{flex:1;border:none;background:var(--bg-card-alt);border-radius:8px;padding:4px 0;
    font-size:14px;cursor:pointer;opacity:.4;transition:.15s}
  .moods button.on{opacity:1;box-shadow:0 0 0 2px var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>情绪水晶球 v2</h1>
  <div class="sub">水位 = 真实用时 · 满球 = 24h · 活动可同属两种效率，故按类独立计量</div>

  <div class="stage">
    <div>
      <div class="planTitle">方案 A · 两球双腔（刚需面 / 消遣面）</div>
      <div class="orbRow">
        <div class="orbUnit">
          <div class="orb big">
            <div class="half l"><div class="liquid" id="A0"><div class="wave" id="wA0"></div></div></div>
            <div class="half r"><div class="liquid" id="A1"><div class="wave" id="wA1"></div></div></div>
            <div class="divV"></div><div class="specular"></div><div class="rim"></div>
          </div>
          <div class="cap"><div class="pair"><span>生产性</span><span>日常性</span></div></div>
        </div>
        <div class="orbUnit">
          <div class="orb big">
            <div class="half l"><div class="liquid" id="B0"><div class="wave" id="wB0"></div></div></div>
            <div class="half r"><div class="liquid" id="B1"><div class="wave" id="wB1"></div></div></div>
            <div class="divV"></div><div class="specular"></div><div class="rim"></div>
          </div>
          <div class="cap"><div class="pair"><span>创造性</span><span>娱乐性</span></div></div>
        </div>
      </div>

      <div class="planTitle">方案 B · 四颗独立小球</div>
      <div class="orbRow">
        <div class="orbUnit"><div class="orb small"><div class="liquid" id="s0"><div class="wave" id="ws0"></div></div><div class="specular"></div><div class="rim"></div></div><div class="capOne">创造性</div></div>
        <div class="orbUnit"><div class="orb small"><div class="liquid" id="s1"><div class="wave" id="ws1"></div></div><div class="specular"></div><div class="rim"></div></div><div class="capOne">生产性</div></div>
        <div class="orbUnit"><div class="orb small"><div class="liquid" id="s2"><div class="wave" id="ws2"></div></div><div class="specular"></div><div class="rim"></div></div><div class="capOne">娱乐性</div></div>
        <div class="orbUnit"><div class="orb small"><div class="liquid" id="s3"><div class="wave" id="ws3"></div></div><div class="specular"></div><div class="rim"></div></div><div class="capOne">日常性</div></div>
      </div>

      <div class="insight" id="insight"></div>
    </div>

    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
function srgbToLin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
function linToSrgb(c){const v=c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;return Math.round(Math.min(1,Math.max(0,v))*255)}
function hexToRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToOklab(r,g,b){r=srgbToLin(r);g=srgbToLin(g);b=srgbToLin(b);
  const l=0.4122214708*r+0.5363325363*g+0.0514459929*b,m=0.2119034982*r+0.6806995451*g+0.1073969566*b,s=0.0883024619*r+0.2817188376*g+0.6299787005*b;
  const l_=Math.cbrt(l),m_=Math.cbrt(m),s_=Math.cbrt(s);
  return[0.2104542553*l_+0.7936177850*m_-0.0040720468*s_,1.9779984951*l_-2.4285922050*m_+0.4505937099*s_,0.0259040371*l_+0.7827717662*m_-0.8086757660*s_]}
function oklabToRgb(L,a,b){const l_=L+0.3963377774*a+0.2158037573*b,m_=L-0.1055613458*a-0.0638541728*b,s_=L-0.0894841775*a-1.2914855480*b;
  const l=l_**3,m=m_**3,s=s_**3;
  return[linToSrgb(4.0767416621*l-3.3077115913*m+0.2309699292*s),linToSrgb(-1.2684380046*l+2.6097574011*m-0.3413193965*s),linToSrgb(-0.0041960863*l-0.7034186147*m+1.7076147010*s)]}
const cssa=(rgb,a)=>`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
function variant(rgb,dL,mulC){let[L,a,b]=rgbToOklab(...rgb);const C=Math.hypot(a,b),H=Math.atan2(b,a);
  return oklabToRgb(Math.min(1,Math.max(0,L+dL)),Math.max(0,C*mulC)*Math.cos(H),Math.max(0,C*mulC)*Math.sin(H))}
function blend(items,w,chroma,dom){const wp=w.map(x=>Math.pow(x,dom));const t=wp.reduce((s,x)=>s+x,0);if(t<=0)return[213,208,196];
  let L=0,a=0,b=0;items.forEach((it,i)=>{const k=wp[i]/t;L+=k*it.oklab[0];a+=k*it.oklab[1];b+=k*it.oklab[2]});
  return oklabToRgb(L,a*chroma,b*chroma)}

const CHROMA=3.2,DOM=3.5,DEPTH=0.55,ALPHA=0.82,WAVE=0.5,AMP=1+WAVE*4,DUR=(9-WAVE*6).toFixed(1);
const EMO=[{emo:'😊',nm:'愉悦',hex:'#A8BF94'},{emo:'😌',nm:'平静',hex:'#94ADBF'},{emo:'😐',nm:'还行',hex:'#BFB894'},{emo:'😔',nm:'低落',hex:'#B09BA8'},{emo:'😤',nm:'压力',hex:'#BF9A8A'}];
EMO.forEach(e=>{e.rgb=hexToRgb(e.hex);e.oklab=rgbToOklab(...e.rgb)});
const Q=[{name:'创造性',hours:2,mood:0},{name:'生产性',hours:9,mood:4},{name:'娱乐性',hours:1.5,mood:0},{name:'日常性',hours:7,mood:1}];
const MAP=[{l:'A0',w:'wA0',q:1},{l:'A1',w:'wA1',q:3},{l:'B0',w:'wB0',q:0},{l:'B1',w:'wB1',q:2},
  {l:'s0',w:'ws0',q:0},{l:'s1',w:'ws1',q:1},{l:'s2',w:'ws2',q:2},{l:'s3',w:'ws3',q:3}];

function waveSVG(color,amp){const a=Math.max(1,amp);
  return `<svg viewBox="0 0 120 18" preserveAspectRatio="none"><path fill="${color}" d="M0 ${9-a} Q 15 ${9-a*2} 30 ${9-a} T 60 ${9-a} T 90 ${9-a} T 120 ${9-a} V18 H0 Z"/></svg>`.repeat(2)}

function paint(liqId,waveId,q,idx){
  const w=EMO.map((_,j)=>j===q.mood?100:0);
  const base=blend(EMO,w,CHROMA,DOM);
  const top=variant(base,+0.10*DEPTH,1-0.45*DEPTH), bot=variant(base,-0.18*DEPTH,1+0.80*DEPTH);
  const liq=document.getElementById(liqId);
  liq.style.height=Math.min(100,q.hours/24*100)+'%';
  liq.style.background=`linear-gradient(180deg,${cssa(top,ALPHA*.88)} 0%,${cssa(base,ALPHA)} 45%,${cssa(bot,Math.min(1,ALPHA+.08))} 100%)`;
  const wv=document.getElementById(waveId);
  wv.innerHTML=waveSVG(cssa(top,ALPHA*.9),AMP);
  if(!wv.dataset.anim){wv.style.animation=`drift ${DUR}s linear infinite ${idx%2?'reverse':''}`;wv.dataset.anim=1}
}
function renderAll(){
  MAP.forEach((m,i)=>paint(m.l,m.w,Q[m.q],i));
  const t=[...Q].sort((a,b)=>b.hours-a.hours)[0];
  document.getElementById('insight').innerHTML=`💡 <b>${t.name}</b>的时间最多，常伴 ${EMO[t.mood].emo}${EMO[t.mood].nm}`;
}
function renderPanel(){
  document.getElementById('panel').innerHTML=Q.map((q,i)=>`
    <div class="block"><div class="bhead"><span class="bname">${q.name}</span><span class="btime" id="t${i}"></span></div>
    <input type="range" min="0" max="24" step="0.5" value="${q.hours}" data-q="${i}">
    <div class="moods" data-m="${i}">${EMO.map((e,j)=>`<button data-mi="${j}" class="${j===q.mood?'on':''}">${e.emo}</button>`).join('')}</div></div>`).join('');
  Q.forEach((q,i)=>document.getElementById('t'+i).textContent=q.hours+'h');
  document.querySelectorAll('.panel input[type=range]').forEach(el=>el.addEventListener('input',e=>{
    const i=+e.target.dataset.q;Q[i].hours=+e.target.value;document.getElementById('t'+i).textContent=Q[i].hours+'h';renderAll()}));
  document.querySelectorAll('.moods').forEach(row=>row.addEventListener('click',e=>{
    if(e.target.tagName!=='BUTTON')return;const i=+row.dataset.m;Q[i].mood=+e.target.dataset.mi;
    row.querySelectorAll('button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');renderAll()}));
}
renderPanel();renderAll();
</script>
</body>
</html>
